name: YFL U11 Form Guide – Weekly Automation

on:
  schedule:
    # Every Tuesday at 18:00 UAE (14:00 UTC)
    - cron: "0 14 * * TUE"
  workflow_dispatch:

permissions:
  contents: read        # the job only needs to read this repository

# A manual run must not overlap the scheduled one (each run sends an email).
concurrency:
  group: yfl-form-guide
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests (no network, no secrets)
        run: python -m unittest -v

      # Secrets are handed to the script through `env:`, never interpolated into shell commands:
      # a secret containing a quote, `$(...)` or a newline cannot break out of the command or
      # inject other variables, and the old "debug" step that echoed EMAIL_RECEIVER is gone.
      - name: Build the form guide and email it
        run: python main.py
        env:
          SPORTSTACK_API_TOKEN: ${{ secrets.SPORTSTACK_API_TOKEN }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_SUBJECT: "YFL Weekly Form Guide — U11"
